name: Release

# Push a tag matching v* (the same convention release.sh already uses) and
# this builds .deb, .rpm, and a real Arch package from that exact commit,
# install-tests each one on the actual target distro, and publishes all
# three to one GitHub Release — no local machine, no manual upload.
#
# release.sh stays as a manual/local fallback for a quick one-off build; it
# is NOT called by this workflow (this file ports its build steps instead,
# so a bug in one never silently breaks the other unnoticed).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  NODE_VERSION: '22.14.0'

jobs:
  # ---------------------------------------------------------------------
  # Build .deb and .rpm. Ubuntu already ships dpkg-deb; rpmbuild is one
  # apt-get away — same as release.sh's own one-time setup note.
  # ---------------------------------------------------------------------
  build-deb-rpm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install rpmbuild
        run: sudo apt-get update -qq && sudo apt-get install -y rpm

      - name: Build the app
        run: |
          GIT_SHA="$(git rev-parse --short=12 HEAD)"
          printf '{"sha":"%s","builtAt":"%s"}\n' "$GIT_SHA" "$(date -u +%FT%TZ)" > build-info.json
          npm install --no-audit --no-fund
          npm run build

      - name: Build .deb
        run: |
          set -euo pipefail
          DEB_ROOT="$RUNNER_TEMP/deb-root"
          mkdir -p "$DEB_ROOT/opt/touchworkstation/app" "$DEB_ROOT/lib/systemd/system" "$DEB_ROOT/usr/bin" "$DEB_ROOT/DEBIAN"
          cp -a . "$DEB_ROOT/opt/touchworkstation/app/"
          rm -rf "$DEB_ROOT/opt/touchworkstation/app/.git" "$DEB_ROOT/opt/touchworkstation/app/node_modules"
          mkdir -p "$DEB_ROOT/opt/touchworkstation/runtime"
          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" \
            | tar -xJ --strip-components=1 -C "$DEB_ROOT/opt/touchworkstation/runtime"
          cp packaging/debian/touchworkstation.service "$DEB_ROOT/lib/systemd/system/"
          for f in packaging/bin/*; do
            [ "$(basename "$f")" = "xdg-open" ] && continue
            cp "$f" "$DEB_ROOT/usr/bin/"
          done
          chmod +x "$DEB_ROOT"/usr/bin/*
          mkdir -p "$DEB_ROOT/usr/local/bin"
          cp packaging/bin/xdg-open "$DEB_ROOT/usr/local/bin/xdg-open"
          chmod +x "$DEB_ROOT/usr/local/bin/xdg-open"
          cp packaging/debian/control packaging/debian/postinst packaging/debian/prerm "$DEB_ROOT/DEBIAN/"
          DEB_VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^Version: .*/Version: $DEB_VERSION/" "$DEB_ROOT/DEBIAN/control"
          mkdir -p dist
          dpkg-deb --build --root-owner-group "$DEB_ROOT" "dist/touchworkstation_${DEB_VERSION}_amd64.deb"

      - name: Build .rpm
        run: |
          set -euo pipefail
          RPM_VERSION="$(echo "${GITHUB_REF_NAME#v}" | sed 's/-/./g')"
          RPMBUILD_DIR="$RUNNER_TEMP/rpmbuild"
          mkdir -p "$RPMBUILD_DIR"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          RPM_PAYLOAD="$RUNNER_TEMP/rpm-payload/touchworkstation-$RPM_VERSION"
          mkdir -p "$RPM_PAYLOAD/opt/touchworkstation" "$RPM_PAYLOAD/usr/bin" "$RPM_PAYLOAD/usr/local/bin"
          cp -a "$RUNNER_TEMP/deb-root/opt/touchworkstation/app" "$RPM_PAYLOAD/opt/touchworkstation/"
          cp -a "$RUNNER_TEMP/deb-root/opt/touchworkstation/runtime" "$RPM_PAYLOAD/opt/touchworkstation/"
          for f in packaging/bin/*; do
            [ "$(basename "$f")" = "xdg-open" ] && continue
            cp "$f" "$RPM_PAYLOAD/usr/bin/"
          done
          chmod +x "$RPM_PAYLOAD"/usr/bin/*
          cp packaging/bin/xdg-open "$RPM_PAYLOAD/usr/local/bin/xdg-open"
          chmod +x "$RPM_PAYLOAD/usr/local/bin/xdg-open"
          (cd "$RUNNER_TEMP/rpm-payload" && tar -czf "$RPMBUILD_DIR/SOURCES/touchworkstation-$RPM_VERSION.tar.gz" "touchworkstation-$RPM_VERSION")
          sed "s/^Version:.*/Version:        $RPM_VERSION/" packaging/rpm/touchworkstation.spec > "$RPMBUILD_DIR/SPECS/touchworkstation.spec"
          rpmbuild --define "_topdir $RPMBUILD_DIR" -bb "$RPMBUILD_DIR/SPECS/touchworkstation.spec"
          cp "$RPMBUILD_DIR"/RPMS/x86_64/*.rpm dist/

      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: dist/*.rpm

  # ---------------------------------------------------------------------
  # Build a real Arch package. release.sh can only bundle the PKGBUILD
  # *source* because the dev machine it runs on isn't Arch — a real Arch
  # container can actually run makepkg and produce the .pkg.tar.zst.
  # ---------------------------------------------------------------------
  build-arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 15
    steps:
      - name: Install build tools
        run: |
          pacman -Sy --noconfirm --needed git nodejs npm base-devel sudo
      - uses: actions/checkout@v4
      - name: makepkg (as a non-root build user — it refuses to run as root)
        run: |
          set -euo pipefail
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          # PKGBUILD's own source=() re-clones the repo from GitHub as its
          # build source (this is a -git package) — HEAD of the default
          # branch at clone time, which is this exact tagged commit
          # immediately after a release tag is cut from it.
          #
          # ARCH_DIR is expanded HERE, in this root shell, before sudo runs —
          # sudo does not preserve the caller's environment by default, so a
          # single-quoted command relying on $GITHUB_WORKSPACE surviving into
          # the builder user's shell silently expanded to empty and failed
          # with "cd: /packaging/arch: No such file or directory".
          ARCH_DIR="$GITHUB_WORKSPACE/packaging/arch"
          sudo -u builder bash -c "cd '$ARCH_DIR' && makepkg --noconfirm -s"
      - run: mkdir -p dist && cp packaging/arch/*.pkg.tar.zst dist/
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: dist/*.pkg.tar.zst

  # ---------------------------------------------------------------------
  # Smoke tests — building a package proves nothing about whether
  # installing it actually works. The RPM password-change bug fixed
  # earlier (wrong chmod on the credentials file) only ever showed up
  # after a real install ran %post on a real filesystem; a build-only
  # pipeline would never have caught it. Each package gets installed for
  # real on its actual target distro, then the exact first-login
  # password-change flow is exercised end-to-end over HTTP.
  # ---------------------------------------------------------------------

  # Real VM, not a container — systemd is genuinely PID 1 here, so this is
  # the highest-fidelity test: install exactly like a real user would.
  smoke-deb:
    runs-on: ubuntu-latest
    needs: build-deb-rpm
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with: { name: deb-package, path: dist }
      - name: Install and verify first-login password flow
        run: |
          set -euo pipefail
          sudo dpkg -i dist/*.deb || sudo apt-get install -f -y
          for i in $(seq 1 60); do systemctl is-active --quiet touchworkstation && break; sleep 1; done
          systemctl is-active --quiet touchworkstation || { journalctl -u touchworkstation --no-pager -n 200; exit 1; }
          jar="$RUNNER_TEMP/cookies.txt"
          # The env file is root:<app-group> mode 660 by design (postinst
          # picks whichever uid>=1000 account it finds first as the "app
          # user" — not necessarily this job's own runner account) — sudo,
          # not a plain read, is the only thing that works regardless of
          # which account postinst happened to pick.
          PW=$(sudo grep '^APP_PASSWORD=' /etc/touchworkstation/touchworkstation.env | cut -d= -f2-)
          curl -sf -c "$jar" -X POST http://127.0.0.1:8787/api/login -H 'Content-Type: application/json' -d "{\"password\":\"$PW\"}" | grep -q '"mustChangePassword":true'
          curl -sf -b "$jar" http://127.0.0.1:8787/api/me | grep -q '"mustChangePassword":true'
          curl -sf -b "$jar" -X POST http://127.0.0.1:8787/api/change-password -H 'Content-Type: application/json' -d "{\"currentPassword\":\"$PW\",\"newPassword\":\"a-new-password-123\"}" | grep -q '"ok":true'
          curl -sf -b "$jar" http://127.0.0.1:8787/api/me | grep -q '"mustChangePassword":false'
          echo "deb install + first-login password flow verified"

  # Arch's post_install() deliberately never calls systemctl itself (it
  # prints "run: sudo systemctl enable --now ..." for the human to do) —
  # so this doesn't need a systemd-capable container, just a plain one.
  smoke-arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    needs: build-arch
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with: { name: arch-package, path: dist }
      - name: Install and verify first-login password flow
        run: |
          set -euo pipefail
          pacman -Sy --noconfirm --needed nodejs npm nginx git tmux github-cli openssl procps-ng iproute2 psmisc curl grep sudo
          useradd -m testuser
          pacman -U --noconfirm dist/*.pkg.tar.zst
          test -f /etc/touchworkstation/touchworkstation.env
          [ "$(stat -c %a /etc/touchworkstation/touchworkstation.env)" = "660" ] || { echo "env file has wrong permissions"; exit 1; }
          grep -q '^PW_MUST_CHANGE=1' /etc/touchworkstation/touchworkstation.env
          set -a; source /etc/touchworkstation/touchworkstation.env; set +a
          sudo -u testuser env $(cat /etc/touchworkstation/touchworkstation.env | xargs) \
            bash -c 'cd /opt/touchworkstation/app && /usr/bin/node server/index.js &'
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8787/api/me >/dev/null 2>&1 && break; sleep 1; done
          jar=/tmp/cookies.txt
          curl -sf -c "$jar" -X POST http://127.0.0.1:8787/api/login -H 'Content-Type: application/json' -d "{\"password\":\"$APP_PASSWORD\"}" | grep -q '"mustChangePassword":true'
          curl -sf -b "$jar" -X POST http://127.0.0.1:8787/api/change-password -H 'Content-Type: application/json' -d "{\"currentPassword\":\"$APP_PASSWORD\",\"newPassword\":\"a-new-password-123\"}" | grep -q '"ok":true'
          curl -sf -b "$jar" http://127.0.0.1:8787/api/me | grep -q '"mustChangePassword":false'
          echo "arch install + first-login password flow verified"

  # RPM's %post unconditionally calls `systemctl enable --now` (unlike the
  # .deb/Arch equivalents, which guard or skip it) — the official `fedora`
  # Docker image has no systemd/init at all (confirmed: `/usr/sbin/init`
  # doesn't exist in it, a real "systemd inside Docker" setup needs a
  # purpose-built image this workflow shouldn't take an external dependency
  # on), so that systemctl call is guaranteed to fail here no matter what.
  # Tolerated with `|| true` — by the time it runs, %post has already
  # written the env file and finished the npm install/build (verified
  # directly below), so the failure is purely "no systemd in this
  # container" and not a real install problem. Same manual-start pattern
  # smoke-arch already uses successfully.
  smoke-rpm:
    runs-on: ubuntu-latest
    container: fedora:40
    needs: build-deb-rpm
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with: { name: rpm-package, path: dist }
      - name: Install and verify first-login password flow
        run: |
          set -euo pipefail
          dnf install -y sudo shadow-utils procps-ng curl >/dev/null
          # %post installs nginx/gcc/gh itself if any are missing (a bare
          # fedora:40 container has none of them) — via a NESTED dnf
          # transaction run from inside this one's own scriptlet. dnf can
          # hang indefinitely waiting on its own lock in that situation:
          # confirmed live, the previous attempt sat frozen for 16+ minutes
          # at exactly this step with zero output before being force-
          # cancelled. Pre-installing all three here first, as their own
          # separate transaction that fully finishes before the real
          # package install starts, lets %post's own `command -v ... ||
          # ...` guards find them already present and skip the nested
          # calls entirely.
          dnf install -y dnf-plugins-core nginx gcc gcc-c++ make python3 >/dev/null
          dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo
          dnf install -y gh >/dev/null
          # %post's own user-detection (`getent passwd` for a uid>=1000
          # account) needs someone to find, and needs to find them BEFORE
          # dnf runs %post as part of this same install.
          useradd -m testuser
          dnf install -y dist/*.rpm || true
          test -f /etc/touchworkstation/touchworkstation.env
          [ "$(stat -c %a /etc/touchworkstation/touchworkstation.env)" = "660" ] || { echo "env file has wrong permissions"; exit 1; }
          grep -q '^PW_MUST_CHANGE=1' /etc/touchworkstation/touchworkstation.env
          set -a; source /etc/touchworkstation/touchworkstation.env; set +a
          sudo -u testuser env $(cat /etc/touchworkstation/touchworkstation.env | xargs) \
            bash -c 'cd /opt/touchworkstation/app && /opt/touchworkstation/runtime/bin/node server/index.js &'
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8787/api/me >/dev/null 2>&1 && break; sleep 1; done
          jar=/tmp/cookies.txt
          curl -sf -c "$jar" -X POST http://127.0.0.1:8787/api/login -H 'Content-Type: application/json' -d "{\"password\":\"$APP_PASSWORD\"}" | grep -q '"mustChangePassword":true'
          curl -sf -b "$jar" -X POST http://127.0.0.1:8787/api/change-password -H 'Content-Type: application/json' -d "{\"currentPassword\":\"$APP_PASSWORD\",\"newPassword\":\"a-new-password-123\"}" | grep -q '"ok":true'
          curl -sf -b "$jar" http://127.0.0.1:8787/api/me | grep -q '"mustChangePassword":false'
          echo "rpm install + first-login password flow verified"

  # ---------------------------------------------------------------------
  # One release, all three assets — only once every install has been
  # proven to actually work, not just build.
  # ---------------------------------------------------------------------
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: [smoke-deb, smoke-arch, smoke-rpm]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*.rpm dist/*.pkg.tar.zst \
            --title "$GITHUB_REF_NAME" --generate-notes --latest --repo "$GITHUB_REPOSITORY"
