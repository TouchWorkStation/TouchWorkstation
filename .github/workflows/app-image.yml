# Builds the Omarchy Server App Store image, tests it end to end, and (on master) publishes it to
# ghcr.io/touchworkstation/touchworkstation-app.
name: App Store image
on:
  push:
    branches: [master]
    paths: ['server/**', 'ui/**', 'package.json', 'packaging/app-store/**', '.github/workflows/app-image.yml']
  pull_request:
    paths: ['server/**', 'ui/**', 'package.json', 'packaging/app-store/**', '.github/workflows/app-image.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f packaging/app-store/Dockerfile --build-arg BUILD_SHA=${GITHUB_SHA::12} -t tw-app:test .
      - name: Test end to end
        run: packaging/app-store/test.sh tw-app:test
      - name: Publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for t in latest ${GITHUB_SHA::12}; do
            docker tag tw-app:test ghcr.io/touchworkstation/touchworkstation-app:$t
            docker push ghcr.io/touchworkstation/touchworkstation-app:$t
          done
