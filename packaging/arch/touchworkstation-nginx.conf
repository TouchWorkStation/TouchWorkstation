# Also listen on :80 so plain http://<host> (LAN IP, .local, or a Tailscale
# <host>.ts.net name) serves the app instead of nginx's stock "Welcome to nginx"
# default page. This drop-in is included first (see the include added to
# nginx.conf by touchworkstation.install), so it's the default server for :80 —
# it wins over Arch's stock localhost server for any other hostname/IP. :8088 is
# kept for backward compatibility. HTTPS (the padlock) still comes from
# `tailscale serve` on :443 → the app.
server {
  listen 8088;
  listen 80 default_server;
  server_name _;
  client_max_body_size 64m;

  location / {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
