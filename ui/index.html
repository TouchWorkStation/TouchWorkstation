<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,interactive-widget=resizes-content"/><meta name="theme-color" content="#300a24"/><meta name="apple-mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/><meta name="apple-mobile-web-app-title" content="TouchWorkstation"/><link rel="apple-touch-icon" href="/apple-touch-icon.png"/><link rel="manifest" href="/manifest.webmanifest"/><title>TouchWorkstation</title></head><body><div id="root"></div><script type="module" src="/src/main.jsx"></script><script>/* A service worker left registered by an older install keeps serving its
cached bundle, so an update installs on the machine but the phone still runs
the old UI — "I updated and the change isn't there". Unregistering alone
wasn't enough: it ran on `load`, by which point the stale assets had already
been served through that worker, so the user had to know to refresh a second
time. Now, if anything was actually torn down, reload once so the fresh
bundle loads immediately. sessionStorage guards against a reload loop. */
if('serviceWorker'in navigator){addEventListener('load',function(){navigator.serviceWorker.getRegistrations().then(function(rs){var had=rs.length>0;rs.forEach(function(r){r.unregister()});var done=function(){if(had&&!sessionStorage.getItem('tw-sw-purged')){try{sessionStorage.setItem('tw-sw-purged','1')}catch(e){}location.reload()}};if(window.caches){caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}).then(done).catch(done)}else{done()}}).catch(function(){})})}</script></body></html>
